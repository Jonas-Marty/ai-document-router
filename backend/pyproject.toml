[project]
name = "ai-document-router-backend"
version = "0.1.0"
description = "AI Document Router backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.39",
    "alembic>=1.19.1",
    "cryptography>=50.0.0",
    "webdav4>=0.11.0",
    "pypdf>=6.16.1",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "mypy>=1.13",
    "httpx>=0.27",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
plugins = ["pydantic.mypy"]

# webdav4 ships no py.typed marker. Confined to services/webdav.py, which is the only
# module allowed to import it, so the untyped surface stays behind our own dataclasses.
[[tool.mypy.overrides]]
module = ["webdav4.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
