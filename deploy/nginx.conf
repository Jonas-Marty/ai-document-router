# Serves the built SPA and proxies the API, so the browser sees one origin. This is
# load-bearing, not a convenience: services/api/client.ts hardcodes a relative `/api/v1`
# base, so without this proxy the deployed frontend has no way to reach the backend.
# Same-origin also means the backend's CORS_ORIGINS is a development-only concern.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long enough for the slowest thing that legitimately goes through here: a document
    # content stream the backend is pulling from WebDAV (30s WebDAV timeout, plus overhead).
    # Proposal generation is deliberately not in this path -- regenerate is asynchronous and
    # the poller makes the LLM call out of band.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # nginx does not merge add_header across levels: a location that declares any add_header
    # of its own discards every add_header inherited from the server block. So these two are
    # repeated verbatim in each location below that sets Cache-Control. Locations with no
    # add_header at all (/api) inherit them from here as normal.
    add_header X-Content-Type-Options "nosniff" always;
    # SAMEORIGIN rather than DENY: pdf.js renders to a canvas today, but blocking same-origin
    # framing outright is a trap waiting for the first embedded preview.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Docker's embedded DNS. Without re-resolution nginx caches the API container's IP from
    # startup forever, so an `api` restart that lands on a new IP would 502 every request
    # until the web container was restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # No trailing slash, so a bare `/api` is proxied too rather than falling through to the
    # SPA fallback and answering an API call with index.html.
    location /api {
        # The hostname goes through a variable purely to force that re-resolution; with a
        # literal, nginx resolves once at startup. $request_uri is then required to pass the
        # path and query string through unchanged.
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames here (including the pdf.js worker and the self-hosted
    # Inter woff2 files), so a given URL never changes content and can be cached indefinitely.
    # =404 rather than the SPA fallback below: a missing hashed asset is a broken deploy, and
    # answering it with index.html turns that into a confusing "unexpected token <" instead of
    # an honest 404.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # The SPA entry point must revalidate on every load, otherwise a cached index.html keeps
    # pointing at the previous build's asset hashes after an update.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Client-side routing: /history and /settings are real URLs to the user but not files on
    # disk, so anything unmatched hands back the app shell and react-router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
