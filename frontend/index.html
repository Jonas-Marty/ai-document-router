<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Document Router</title>
    <script>
      // Applied before React mounts so there's no flash of the wrong theme on load.
      // ThemeProvider (src/components/layout/ThemeProvider.tsx) is the source of truth
      // afterwards; keep the storage key and logic in sync with it.
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          // Storage unavailable; fall back to the CSS prefers-color-scheme default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
